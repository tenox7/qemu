name: Build QEMU WinRT (WoA)

on:
  push:
    branches:
      - qemu-winrt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-arm-system:
    name: Windows x86-64 (MSYS2 UCRT64)
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out the source tree
        uses: actions/checkout@v6
        with:
          ref: qemu-winrt

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            bison
            diffutils
            findutils
            flex
            git
            grep
            make
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-zlib

      - name: Configure and build the ARM system emulator
        run: |
          set -euo pipefail

          build_dir=build-winrt
          rm -rf "$build_dir"
          mkdir -p "$build_dir"
          (
            cd "$build_dir"
            CC=gcc CXX=g++ ../configure \
              --python=/ucrt64/bin/python \
              --target-list=arm-softmmu \
              --enable-system \
              --enable-tcg \
              --enable-pixman \
              --enable-fdt=system \
              --enable-sdl \
              --enable-vnc \
              --disable-gtk \
              --disable-docs \
              --disable-guest-agent \
              --disable-rust \
              --disable-werror
          )

          ninja -C "$build_dir" -j"$(nproc)" \
            qemu-system-arm.exe \
            qemu-system-armw.exe \
            qemu-img.exe

          "$build_dir/qemu-system-arm.exe" --version
          "$build_dir/qemu-img.exe" --version
          "$build_dir/qemu-system-arm.exe" -machine help

      - name: Stage build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $PWD "dist\qemu-winrt-windows-x86_64"
          $firmware = Join-Path $stage "share\qemu"
          New-Item -ItemType Directory -Force -Path $firmware | Out-Null
          Copy-Item build-winrt\qemu-system-arm.exe, build-winrt\qemu-system-armw.exe, build-winrt\qemu-img.exe $stage
          Copy-Item pc-bios\* $firmware -Recurse
          Copy-Item COPYING, COPYING.LIB, LICENSE, README.rst $stage

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: QEMU-WinRT-Windows-AMD64
          path: dist/qemu-winrt-windows-x86_64
          if-no-files-found: error
          archive: true
